name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Assemble Debug APK
        run: |
          gradle assembleDebug --stacktrace > build.log 2>&1 || {
            tail -n 120 build.log > build_error.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add build_error.txt
            git commit -m "build failure log" || true
            git push origin main || true
            exit 1
          }

      - name: Release APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find app/build/outputs -name "*.apk"
          APK_PATH=$(find app/build/outputs -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            gh release create v0.1.0-build1 "$APK_PATH" \
              --title "图书 v0.1.0 (Build 1)" \
              --notes "iOS 原版图书 Android 复刻版 Debug APK" \
              --clobber
          else
            echo "No APK found in app/build/outputs"
            exit 1
          fi
