name: Build Android APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure Android SDK
        run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
      - name: Assemble debug APK
        run: gradle assembleDebug --continue --stacktrace --info
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0-build1 app/build/outputs/apk/debug/app-debug.apk --title "Apple Books Android v0.1.0 build 1" --notes "Debug APK build for native Android reader." --clobber || gh release upload v0.1.0-build1 app/build/outputs/apk/debug/app-debug.apk --clobber
