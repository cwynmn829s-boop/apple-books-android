name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Assemble Debug APK
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee build_output.txt || {
            echo "=== GRADLE FAILED ==="
            tail -n 120 build_output.txt > failed_tail.txt
            gh release create v-fail-log failed_tail.txt --title "Compile Failure Log" --notes "Failed log" --clobber || true
            exit 1
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.1.0-build1 app/build/outputs/apk/debug/app-debug.apk \\
            --title "图书 v0.1.0 (Build 1)" \\
            --notes "iOS 原版图标与交互 Android 复刻版 Debug APK" \\
            --clobber
