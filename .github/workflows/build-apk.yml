name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace --info
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0-build1 app/build/outputs/apk/debug/app-debug.apk --title "Apple Books Android v0.1.0 build 1" --notes "Debug APK build for native Android reader." || gh release upload v0.1.0-build1 app/build/outputs/apk/debug/app-debug.apk --clobber
